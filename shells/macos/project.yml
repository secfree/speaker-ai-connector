name: SpeakerAIConnector
options:
  bundleIdPrefix: com.secfree
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.4.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES

targets:
  SpeakerAIConnector:
    type: application
    platform: macOS
    sources:
      - path: Sources
        excludes:
          - "App/SpeakerAIConnector-Bridging-Header.h"
      # v0.3 N2: ship the Silero v5 ONNX model + provenance docs inside
      # the .app bundle so the user doesn't have to download a model on
      # first launch. The fetch script and README aren't shipped — only
      # the .onnx weights end up in Contents/Resources/.
      - path: Resources/silero_vad.onnx
        buildPhase: resources
      # v0.9 N2: ship the Stage B selector recipes so auto-click has its
      # bundled (not fetched) contract in Contents/Resources/.
      - path: Resources/voice-selectors.json
        buildPhase: resources
    preBuildScripts:
      - name: Build Rust core
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          CARGO_PROFILE="debug"
          CARGO_FLAGS=""
          if [ "${CONFIGURATION}" = "Release" ]; then
            CARGO_PROFILE="release"
            CARGO_FLAGS="--release"
          fi
          cd "${SRCROOT}/../../core"
          cargo build ${CARGO_FLAGS}
    dependencies:
      - sdk: AudioUnit.framework
      - sdk: AudioToolbox.framework
      - sdk: CoreAudio.framework
      - sdk: CoreFoundation.framework
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleName: Speaker AI Connector
        CFBundleDisplayName: Speaker AI Connector
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: ""
        NSBluetoothAlwaysUsageDescription: "Speaker AI Connector watches for your chosen Bluetooth speaker connecting so it can start an AI voice session automatically."
        NSMicrophoneUsageDescription: "Speaker AI Connector captures audio from the Bluetooth speaker's microphone and streams it to the AI service."
    entitlements:
      path: Sources/App/SpeakerAIConnector.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.device.bluetooth: true
        com.apple.security.device.audio-input: true
        com.apple.security.network.client: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.secfree.SpeakerAIConnector
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        COMBINE_HIDPI_IMAGES: YES
        SWIFT_OBJC_BRIDGING_HEADER: Sources/App/SpeakerAIConnector-Bridging-Header.h
        LIBRARY_SEARCH_PATHS:
          - $(SRCROOT)/../../core/target/debug
        # v0.3 N2: the `silero` feature pulls in `ort` -> ONNX Runtime,
        # whose static archive is bundled into libspeaker_core.a and
        # references C++ ABI symbols (`__cxa_throw`, `__cxa_rethrow`,
        # `__gxx_personality_v0`) plus Foundation/Security/iconv. A
        # pure-Swift target doesn't auto-link any of those, so the .app
        # fails to link without these explicit flags. `cargo rustc
        # --print=native-static-libs` is the source for the list.
        OTHER_LDFLAGS:
          - -lspeaker_core
          - -lc++
          - -liconv
          - -framework
          - Foundation
          - -framework
          - Security
      configs:
        Release:
          LIBRARY_SEARCH_PATHS:
            - $(SRCROOT)/../../core/target/release

  # v0.9 N2: first Swift test target. A standalone logic-test bundle (no
  # app host, no FFI/Rust linkage) that compiles only the pure-Foundation
  # selector loader so the JSON-contract tests run headlessly via
  # `xcodebuild test` without code signing. See VoiceSelectorsTests.swift.
  SpeakerAIConnectorTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
      - path: Sources/Core/VoiceSelectors.swift
      # v0.9 N3: the auto-click runner. Pure of FFI/BrowserProvider, so its
      # dialect/escaping/poll-loop logic compiles into the host-less bundle.
      - path: Sources/Core/BrowserScriptRunner.swift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.secfree.SpeakerAIConnectorTests
        CODE_SIGNING_ALLOWED: NO

schemes:
  SpeakerAIConnector:
    build:
      targets:
        SpeakerAIConnector: all
  # Tests-only scheme: builds and runs just the standalone logic-test
  # bundle, so `xcodebuild test -scheme SpeakerAIConnectorTests` skips the
  # Rust prebuild and the (signing-gated) app host entirely.
  SpeakerAIConnectorTests:
    build:
      targets:
        SpeakerAIConnectorTests: [test]
    test:
      targets:
        - SpeakerAIConnectorTests
